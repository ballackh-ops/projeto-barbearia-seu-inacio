{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Projeto Integrador{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'barbearia_seu_inacio/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'barbearia_seu_inacio/css/style.css' %}">
</head>
<body>
    {% include "nav.html" %}

    {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include "footer.html" %}

    <script src="{% static 'barbearia_seu_inacio/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
