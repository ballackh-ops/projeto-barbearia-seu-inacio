{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ block.super }} - Alterar Senha{% endblock %}
{% block content %}
<section class="py-5 container">
    <h2>Alterar Senha</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-warning mt-3">Salvar nova senha</button>
    </form>
</section>
{% endblock %}
