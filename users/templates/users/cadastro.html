{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ block.super }} - Cadastro{% endblock %}
{% block content %}
{% include "nav.html" %}
<section class="py-5 container">
    <h2>Criar Conta</h2>

</section>
{{ form.media }}
{% include "footer.html" %}
{% endblock %}
