{% extends "base.html" %}
{% block title %}{{ block.super }} - Confirmar Remoção{% endblock %}
{% block content %}
<section class="py-5 container text-center">
  <h2>Tem certeza de que deseja remover este serviço?</h2>
    <div class="d-flex justify-content-center gap-2">
      <a href="{% url 'servico' servico.id %}" class="btn btn-outline-secondary">Cancelar</a>
        <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar remoção</button>
        </form>
    </div>
  </section>
{% endblock %}
