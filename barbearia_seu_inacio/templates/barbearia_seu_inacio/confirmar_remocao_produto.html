{% extends "base.html" %}
{% block title %}Excluir Produto - {{ block.super }}{% endblock %}

{% block content %}
{% include "nav.html" %}

<section class="py-5 container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-danger text-white py-3 text-center">
          <h4 class="mb-0"> Confirmar Exclusão</h4>
        </div>

        <div class="card-body p-4 text-center">
          <p class="fs-5">Tem certeza que deseja excluir o produto <strong>"{{ produto.nome }}"</strong>?</p>

          <form method="POST" class="d-flex justify-content-center gap-3 mt-4">
            {% csrf_token %}
            <a href="{% url 'loja' %}" class="btn btn-secondary px-4">Cancelar</a>
            <button type="submit" class="btn btn-danger px-4">Confirmar Exclusão</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

{% include "footer.html" %}
{% endblock %}
