{% load static %}
{% with current=request.resolver_match.url_name %}
<nav id="nav_nav" class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a href="{% url 'index' %}" class="navbar-brand col text-white">
            <img src="{% static 'Logo.png' %}" alt="logo" class="img-fluid" id="logo">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#menuprincipal" aria-controls="menuprincipal"
        aria-expanded="false" aria-label="toggle menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="menuprincipal" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-lg-auto text-center">
                <li class="nav-item">
                    <a href="{% url 'index' %}"
                       class="nav-link col {% if current == 'index' %}text-warning{% else %}text-white{% endif %}"
                       {% if current == 'index' %}aria-current="page"{% endif %}>Home</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'servicos' %}"
                       class="nav-link col {% if current == 'servicos' %}text-warning{% else %}text-white{% endif %}"
                       {% if current == 'servicos' %}aria-current="page"{% endif %}>Serviços</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'atendimentos' %}"

                       {% if current == 'atendimentos' %}aria-current="page"{% endif %}>Atendimentos</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'galeria' %}"
                       class="nav-link col {% if current == 'galeria' or current == 'postagem' or current == 'nova_postagem' or current == 'editar_postagem' or current == 'remover_postagem' %}text-warning{% else %}text-white{% endif %}"
                       {% if current == 'galeria' or current == 'postagem' or current == 'nova_postagem' or current == 'editar_postagem' or current == 'remover_postagem' %}aria-current="page"{% endif %}>Galeria</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'agenda' %}"

                       {% if current == 'agenda' %}aria-current="page"{% endif %}>Agenda</a>

                <li class="nav-item">

                <li class="nav-item">

                       {% if current == 'contato' %}aria-current="page"{% endif %}>Contato</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'sobre' %}"
                       class="nav-link col {% if current == 'sobre' %}text-warning{% else %}text-white{% endif %}"
                       {% if current == 'sobre' %}aria-current="page"{% endif %}>Sobre</a>

                <li class="nav-item">
                    <a href="{% url 'login' %}" class="btn btn-lg btn-warning">Login</a>
