{% extends "base.html" %}
{% block title %}{{ block.super }} - Login{% endblock %}
{% block content %}
<section class="py-5 container">
    <h2>Entrar</h2>
    {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        <div class="mb-3">
            <label for="username" class="form-label">Nome</label>
            <input type="text" name="username" id="username" class="form-control" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Senha</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-warning">Entrar</button>
    </form>
    <p class="mt-3">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
    <p><a href="{% url 'redefinir_senha' %}">Esqueci minha senha</a></p>
</section>
{% endblock %}
