{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ block.super }} - Recuperar Senha{% endblock %}
{% block content %}
<section class="py-5 container">
    <h2>Esqueceu sua senha?</h2>
    <p>Informe seu nome e seu e-mail e enviaremos instruções para redefinir sua senha.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-warning">Enviar instruções</button>
    </form>
</section>
{% endblock %}
