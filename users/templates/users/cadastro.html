{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ block.super }} - Cadastro{% endblock %}
{% block content %}
{% include "nav.html" %}
<section class="py-5 container">
    <h2>Criar Conta</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
    </form>
    <a href="{% url 'index' %}" class="btn btn-outline-warning">Enviar</a>
    <a href="{% url 'index' %}" class="btn btn-outline-danger">Cancelar</a>
    <p class="mt-3">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
</section>
{% include "footer.html" %}
{% endblock %}
