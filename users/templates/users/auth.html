{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Autenticação - {{ block.super }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        
        <div class="card-header bg-dark text-white">
          <ul class="nav nav-tabs card-header-tabs" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active text-white" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Login</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link text-white" id="cadastro-tab" data-bs-toggle="tab" data-bs-target="#cadastro" type="button" role="tab">Cadastrar</button>
            </li>
          </ul>
        </div>

        <div class="card-body p-4">
          <div class="tab-content" id="authTabsContent">
            
            <div class="tab-pane fade show active" id="login" role="tabpanel">
              <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                {{ login_form|crispy }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>
              </form>
            </div>

            <div class="tab-pane fade" id="cadastro" role="tabpanel">
              <form method="POST" action="{% url 'cadastro' %}">
                {% csrf_token %}
                {{ cadastro_form|crispy }}
                <button type="submit" class="btn btn-success w-100 mt-3">Cadastrar</button>
              </form>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
